name: CI

on:
  push:
    branches: [main, main-54qpxa]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formato, lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    name: Base de datos (migraciones, pgTAP y tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local (sin servicios innecesarios)
        run: npx supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - name: Tests de base de datos (RLS, restricciones, funciones)
        run: npm run db:test
      - name: Variables de la pila local para los tests de integración
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$SECRET_KEY"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - name: Tests de integración (server actions y flujos contra Supabase local)
        run: npm run test:int
      - name: Los tipos generados están al día
        run: |
          npm run db:types
          git diff --exit-code src/types/database.ts

  e2e:
    name: E2E (Playwright contra Supabase local y build de producción)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local
        run: npx supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - name: Variables de la pila local
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$SECRET_KEY"
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100" >> "$GITHUB_ENV"
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Regresión de respuestas perdidas en WebKit
        run: npm run test:e2e -- e2e/sincronizacion-offline.spec.ts e2e/valoracion-recuperacion.spec.ts --project=webkit --grep "termina offline|esfuerzo y nota se recuperan" --repeat-each=3 --retries=0 --max-failures=1
      - name: Pruebas E2E
        run: npm run test:e2e
      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile:
    name: App Expo (tipos, lint, sesión y bundles Android/iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: npm run bundle
        working-directory: mobile
      - name: Instalar navegadores para la interfaz de consulta
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
        working-directory: mobile
