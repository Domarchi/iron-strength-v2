<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Iron Strength · propuesta de diseño</title>

    <header class="review-bar" aria-label="Controles de la propuesta">
      <span>Propuesta · no guarda</span>
      <div class="review-actions">

          <option value="active">En curso</option>

      </div>

    <div class="phone">
      <main id="app" data-view="home" aria-label="Iron Strength, propuesta interactiva"></main>
      <div id="navigation"></div>

    <footer class="review-footer">
      <a id="comparison" href="../comparison.html">Comparar antes y después</a>
