# Solo instalación quality y cuentas ficticias de la pila aislada.
appId: com.domarchis.ironstrength.quality
name: Acceso y consulta de rutina sin iniciar entrenamiento
---
- launchApp:
    clearState: false
- assertVisible: "Inicia sesión"
- tapOn:
    text: "Correo"
    index: 1
- inputText: ${EMAIL}
- pressKey: enter
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Hola, ${FIRST_NAME}"
    timeout: 30000
- tapOn: "Ver rutina A"
- assertVisible: "Empezar entrenamiento"
- assertVisible: "Rutina A"
- assertNotVisible: "Retomar entrenamiento pendiente"
- tapOn: "Volver"
- scrollUntilVisible:
    element: "Descargar entrenamientos"
    direction: DOWN
- tapOn: "Descargar entrenamientos"
- extendedWaitUntil:
    visible: "Disponible sin conexión.*"
    timeout: 30000
