appId: com.domarchis.ironstrength.quality
name: Superserie y alternativa con semana descargada
---
- assertVisible: "SIN CONEXIÓN"
- tapOn: "Consultar rutina descargada A"
- tapOn: "Empezar entrenamiento"
- assertVisible: "Ronda 1 · sigue Sentadilla"
- scrollUntilVisible:
    element: "Detalles del ejercicio"
    waitToSettleTimeoutMs: 500
- tapOn: "Detalles del ejercicio"
- scrollUntilVisible:
    element: "Cambiar a Press de banca inclinado"
    waitToSettleTimeoutMs: 500
- tapOn: "Cambiar a Press de banca inclinado"
- scrollUntilVisible:
    element: "REPS serie 1"
    direction: UP
    waitToSettleTimeoutMs: 500
- tapOn: "REPS serie 1"
- inputText: "8"
- hideKeyboard
- tapOn: "Completar serie 1"
- assertVisible: "Press de banca"
- tapOn: "REPS serie 1"
- inputText: "8"
- hideKeyboard
- tapOn: "Completar serie 1"
- assertVisible: "Tiempo de descanso restante"
